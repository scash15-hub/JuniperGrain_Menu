<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu | Juniper & Grain</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <img src="img/logo.png" alt="Juniper & Grain logo" class="logo" />
      <h1>Our Menu</h1>

      <div class="theme-switcher">
        <p>Choose Your Holiday Theme</p>

        <button class="theme-button active" data-theme="hanukkah" type="button">
          Hanukkah ✡
        </button>

        <button class="theme-button" data-theme="christmas" type="button">
          Christmas 🎄
        </button>
      </div>
    </header>

    <main>
      <!-- Your script builds one button per category in here. -->
      <nav id="filters"></nav>

      <!-- Loading and error messages go here. -->
      <p id="status"></p>

      <!-- Your script builds the category headings and item cards in here. -->
      <section id="menu"></section>
    </main>
  </body>
</html>
